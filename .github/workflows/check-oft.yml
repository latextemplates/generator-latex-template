name: OpenFastTrace

on:
  push:
  pull_request:

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download OpenFastTrace
        run: |
          curl -sSL -o openfasttrace.jar https://github.com/itsallcode/openfasttrace/releases/download/4.11.0/openfasttrace-4.11.0.jar
          echo "f094cd314f0fc4236f513f66fb39260a16f72e2320beb6b4fdeb7940b9b8cf87  openfasttrace.jar" | sha256sum -c
      - name: Collect the tags of the templates
        run: scripts/oft-tags.sh
      - name: Trace the requirements of docs/silent-regressions.md
        run: java -jar openfasttrace.jar trace docs/silent-regressions.md generators/app/index.js build/oft-tags.js
