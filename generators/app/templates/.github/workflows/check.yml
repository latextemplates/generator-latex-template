name: Check
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "5 6 * * 1"
  workflow_dispatch:
concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true
jobs:
  pdf:
    name: pdf (latexmk <%= filenames.main %>)
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
<% if (uml == "tikz-uml") { -%>
        with:
          # Recursive checkout brings in the tikz-uml submodule used by the UML example.
          submodules: recursive
<% } -%>
      - name: Install TeX Live
        uses: zauguin/install-texlive@c9f3ea3d51b2e04d092c4f9d208a19542d5dabcf # v4.5.0
        with:
          package_file: '${{ github.workspace }}/Texlivefile'
          texlive_version: <%= texlive %>
<% if (uml == "plantuml") { -%>
      - name: Install PlantUML
        # Renders the PlantUML UML example (needs Java + the plantuml tool; --shell-escape is set in latexmkrc).
        run: sudo apt-get update && sudo apt-get install -y plantuml
<% } -%>
<% if (uml == "mermaid") { -%>
      - name: Install the Mermaid CLI
        # Renders the Mermaid UML example (Node.js and Chrome are preinstalled on the runner; --shell-escape is set in latexmkrc).
        run: npm install -g @mermaid-js/mermaid-cli
<% } -%>
      - name: Prepare latexmk
        run: |
          updmap -sys
          texhash
          tlmgr generate language --rebuild-sys
      - run: latexmk <%= filenames.main %>
<% if (githubpublish || (lang == "en") && (reallatexcompiler.startsWith("lualatex"))) { -%>

      # Highlight misspelled words in the PDF
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: aspell aspell-en<% if (githubpublish || (language == 'de')) { %> aspell-de<% } %>
          version: 1.0
          execute_install_scripts: true
      - name: post-setup aspell
        # refs https://github.com/awalsh128/cache-apt-pkgs-action/issues/157
        run: |
          sudo apt-get install -y aspell-en<% if (githubpublish || (language == 'de')) { %> aspell-de<% } %>
      - name: aspell
<% if (githubpublish && (documentclass === "scientific-thesis")) { -%>
        # Needs more adaption for scientific thesis; therefore disabled
        if: ${{ false }}
<% } -%>
        run: |
          for tex in *.tex chapters-*/*.tex content-markdown*.md chapters-*/*.md; do
            [ -e "$tex" ] || continue
            if [[ "<%= language %>" == "de" && ( "$tex" == thesis-example* || "$tex" == chapters-de/* ) ]]; then
              continue
            fi

            # The lualatex package "spelling" requires the content to be in a file ending with ".spell.bad"
            # Markdown files may contain LaTeX commands and references (<#id>, {#id}), which are no words.
            if [[ "$tex" == *.md ]]; then
              sed -E 's/\\[A-Za-z]+//g; s/<#[^>]*>//g; s/\{#[^}]*\}//g' "$tex" | aspell --mode=markdown\
                <% if (language == 'de') { %>-l de_DE --run-together<% } else { %>-l en_US<% } %>\
                --encoding=utf-8\
                --conf=./.aspell.conf\
                -p ./.aspell.<%= language %>.pws list\
                | sort | uniq >> <%= filenames.main %>.spell.bad
            else
              aspell --mode=tex\
                <% if (language == 'de') { %>-l de_DE --run-together<% } else { %>-l en_US<% } %>\
                --encoding=utf-8\
                --conf=./.aspell.conf\
                -p ./.aspell.<%= language %>.pws list\
                < "$tex" | sort | uniq >> <%= filenames.main %>.spell.bad
            fi
          done
      - run: latexmk <%= filenames.main %>

      - name: Job summary using texlogsieve
        run: |
          texlogsieve --version | head -n 1

          echo '```' >> $GITHUB_STEP_SUMMARY
          texlogsieve <%= filenames.main %>.log | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> $GITHUB_STEP_SUMMARY
<% } -%>
<% if (githubpublish) { const templateRepo = { acmart: "acm-enhanced", ieee: "ieee-enhanced", lncs: "lncs-enhanced", "scientific-thesis": "scientific-thesis-template", ustutt: "uni-stuttgart-dissertation-template", mwe: "markdown-latex-quickstart" }[documentclass]; -%>
      - name: Compare with the published PDF
        # A TeX Live update can change the output (line breaks, fonts, spacing) without an error.
        # On the weekly run, the PDF published from main is the baseline; differing pages are
        # highlighted in the artifact "pdf-diff". A difference is a warning, not a failure.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get install -y diff-pdf
          if ! curl -sSfL -o published.pdf https://latextemplates.github.io/<%= templateRepo %>/<%= filenames.main %>.pdf; then
            echo "No published <%= filenames.main %>.pdf to compare with." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if diff-pdf --output-diff=pdf-diff.pdf published.pdf <%= filenames.main %>.pdf; then
            echo "<%= filenames.main %>.pdf is identical to the published one." >> "$GITHUB_STEP_SUMMARY"
            rm -f pdf-diff.pdf
          else
            echo "::warning::<%= filenames.main %>.pdf differs from the published one; see the artifact pdf-diff"
            echo "<%= filenames.main %>.pdf **differs** from the published one; the artifact \`pdf-diff\` highlights the changed pages." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && hashFiles('pdf-diff.pdf') != ''
        with:
          name: pdf-diff
          path: pdf-diff.pdf
<% } -%>
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-result
          path: |
            <%= filenames.main %>.pdf
            <%= filenames.main %>.log
            <%= filenames.main %>.fls
<% if (githubpublish && isPaper) { -%>
  comparison:
    # The publisher's class as distributed next to this template, same content (see comparison/build.sh and the README)
    name: comparison (comparison/build.sh)
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install TeX Live
        uses: zauguin/install-texlive@c9f3ea3d51b2e04d092c4f9d208a19542d5dabcf # v4.5.0
        with:
          package_file: '${{ github.workspace }}/Texlivefile'
          texlive_version: <%= texlive %>
      - name: Prepare latexmk
        run: |
          updmap -sys
          texhash
          tlmgr generate language --rebuild-sys
      - name: Install pdftoppm and ImageMagick
        run: sudo apt-get install -y poppler-utils imagemagick
      - run: ./comparison/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comparison
          path: |
            comparison-*.png
            comparison-*.pdf
<% } -%>
<% if (isThesis) { -%>
  chapter:
    # One chapter compiled on its own (package subfiles, see chapters-<%= language %>/README.md)
    name: chapter (latexmk "<%= firstChapter %>")
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install TeX Live
        uses: zauguin/install-texlive@c9f3ea3d51b2e04d092c4f9d208a19542d5dabcf # v4.5.0
        with:
          package_file: '${{ github.workspace }}/Texlivefile'
          texlive_version: <%= texlive %>
      - name: Prepare latexmk
        run: |
          updmap -sys
          texhash
          tlmgr generate language --rebuild-sys
      - run: latexmk "<%= firstChapter %>"
        working-directory: chapters-<%= language %>
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chapter
          path: |
            chapters-<%= language %>/<%= firstChapter.replace(/\s+/g, '') %>.pdf
            chapters-<%= language %>/<%= firstChapter.replace(/\s+/g, '') %>.log
<% } -%>
  word-count:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install TeX Live
        uses: zauguin/install-texlive@c9f3ea3d51b2e04d092c4f9d208a19542d5dabcf # v4.5.0
        with:
          package_file: '${{ github.workspace }}/Texlivefile'
          texlive_version: <%= texlive %>
      - name: Count words
        run: |
          texcount -utf8 -inc <%= filenames.main %>.tex > texcount.txt
          echo "## TeXcount word count" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat "texcount.txt" >> $GITHUB_STEP_SUMMARY

          texcount -utf8 -inc -v -html <%= filenames.main %>.tex > texcount.html

          # output for summary
          # too verbose - therefore disabled
          #
          # texcount -utf8 -inc -v -htmlcore <%= filenames.main %>.tex > texcount.html-body
          # echo "" >> $GITHUB_STEP_SUMMARY
          # echo "## TeXcount LaTeX interpretation" >> $GITHUB_STEP_SUMMARY
          # echo "" >> $GITHUB_STEP_SUMMARY
          # cat "texcount.html-body" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: word-count
          path: |
            texcount.txt
            texcount.html
<%# The mwe class writes Markdown, which aspell cannot parse; the check-markdown (Vale) workflow lints its prose instead, so the aspell spell-check job is omitted here. -%>
<% if (documentclass !== "mwe") { -%>
  spell-check:
    # This is based on https://github.com/mh61503891/action-paper-aspell/tree/master
    #
<% if (documentclass === "scientific-thesis") { -%>
    # Disabled: the example content trips too many aspell false positives to maintain
    if: false
<% } -%>
    runs-on: ubuntu-latest
    # The DANTE e.V. image contains aspell with English and German dictionaries
    container: <%= lintImage %>
    # In a container, steps run with sh by default
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: aspell
        run: |
          echo "| file | status |" >> $GITHUB_STEP_SUMMARY
          echo "| -- | -- |" >> $GITHUB_STEP_SUMMARY
          failure=0
          for tex in *.tex chapters-*/*.tex content-markdown*.md chapters-*/*.md; do
            [ -e "$tex" ] || continue
            if [[ "<%= language %>" == "de" && ( "$tex" == thesis-example* || "$tex" == chapters-de/* ) ]]; then
              echo "$tex skipped"
              continue
            fi
            echo "Checking $tex..."

            # Pick the dictionary that matches the file's language: the "-de"
            # variants are German, everything else uses the document's language.
            case "$tex" in
              *-de.tex|*-de-*.tex|*.de.md|chapters-de/*) aspell_lang="-l de_DE --run-together"; aspell_pws=de ;;
              chapters-en/*) aspell_lang="-l en_US"; aspell_pws=en ;;
              *) aspell_lang="<% if (language == 'de') { %>-l de_DE --run-together<% } else { %>-l en_US<% } %>"; aspell_pws=<%= language %> ;;
            esac

            # Words are output in the order they appear in the document.
            # Markdown files may contain LaTeX commands and references (<#id>, {#id}), which are no words.
            if [[ "$tex" == *.md ]]; then
              words=$(sed -E 's/\\[A-Za-z]+//g; s/<#[^>]*>//g; s/\{#[^}]*\}//g' "$tex" | aspell --mode=markdown $aspell_lang --encoding=utf-8 --conf=./.aspell.conf -p ./.aspell.$aspell_pws.pws list | tr '\n' ' ')
            else
              words=$(aspell --mode=tex $aspell_lang --encoding=utf-8 --conf=./.aspell.conf -p ./.aspell.$aspell_pws.pws list < "$tex" | tr '\n' ' ')
            fi
            if [ -z "$words" ]; then
              echo "| $tex | ✅ |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $tex | ❌ $words |" >> $GITHUB_STEP_SUMMARY
              if [[ "$tex" == "<%= filenames.main %>.tex" || "$tex" == chapters-<%= language %>/* || "$tex" == content-markdown<% if (language != "en") { %>.<%= language %><% } %>.md ]]; then
                failure=1
              fi
            fi
          done
          if [[ "$failure" -eq 1 ]]; then
             echo "" >> $GITHUB_STEP_SUMMARY
             echo 'If you want to ignore words, add them to `.aspell.<%= language %>.pws` (your personal aspell dictionary)' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
  textlint:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Lint English prose with textlint
        run: |
          # Report-only: findings show up as annotations, the job does not fail.
          # Rules come from .textlintrc.json. Only English documents (marked by
          # "% !TeX spellcheck = en-US") are linted: write-good targets English.
          # The English Markdown files (content-markdown.md, chapters-en/*.md) belong to them.
<% if (isThesis) { -%>
          # The English chapters (chapters-en/*.tex) belong to them.
<% } -%>
          files=()
          for tex in *.tex<% if (isThesis) { %> chapters-en/*.tex chapters-en/*.md<% } else { %> content-markdown.md<% } %>; do
            [ -e "$tex" ] || continue
            if [[ "$tex" == chapters-en/* || "$tex" == *.md ]] || grep -q '^% !TeX spellcheck = en' "$tex"; then
              files+=("$tex")
            fi
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "No English files to lint." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes \
            --package textlint \
            --package textlint-plugin-latex2e \
            --package textlint-filter-rule-allowlist \
            --package textlint-rule-terminology \
            --package textlint-rule-write-good \
            textlint --format github "${files[@]}" \
            | sed "s|${GITHUB_WORKSPACE}/||g" | tee annotations.txt || true
          count=$(grep -c '^::\(error\|warning\)' annotations.txt || true)
          echo "textlint reported ${count} finding(s) in: $(IFS=,; echo "${files[*]}")" >> "$GITHUB_STEP_SUMMARY"
  typos:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Finds common misspellings (configured in .typos.toml)
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
<%# TeXtidote checks one language; the German templates contain English template text, so only English documents are checked. -%>
<% if (language == "en") { -%>
  textidote:
    runs-on: ubuntu-latest
    # The DANTE e.V. image contains TeXtidote
    container: <%= lintImage %>
    # In a container, steps run with sh by default
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check spelling, grammar, and style with TeXtidote
        run: |
          # Report-only: findings show up as annotations, the job does not fail.
          # TeXtidote (https://github.com/sylvainhalle/textidote) reads its options from .textidote.
          textidote --output singleline --no-color <%= filenames.main %>.tex > textidote.txt || true
<% if (isThesis) { -%>
          # TeXtidote mixes up the text of \include lines, so .textidote removes them and each chapter is checked on its own
          for tex in chapters-en/*.tex chapters-en/*.md; do
            [ -e "$tex" ] || continue
            textidote --output singleline --no-color --read-all "$tex" >> textidote.txt || true
          done
<% } else { -%>
          # \markdownInput is removed by .textidote, so the Markdown file is checked on its own
          if [ -e content-markdown.md ]; then
            textidote --output singleline --no-color content-markdown.md >> textidote.txt || true
          fi
<% } -%>
          # A finding looks like: file.tex(L25C1-L25C25): message "excerpt"
          perl -ne 'if (/^(.+?)\(L(\d+)C(\d+)-L(\d+)C(\d+)\): (.*)$/) { my ($f, $l, $c, $el, $ec, $m) = ($1, $2, $3, $4, $5, $6); $m =~ s/%/%25/g; print "::warning file=$f,line=$l,col=$c,endLine=$el,endColumn=$ec,title=TeXtidote::$m\n" }' textidote.txt
          echo "TeXtidote reported $(grep -c . textidote.txt) finding(s) in <%= filenames.main %>.tex<% if (isThesis) { %> and its chapters<% } else { %> and content-markdown.md<% } %>" >> "$GITHUB_STEP_SUMMARY"
<% } -%>
<% } -%>
  indent:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libyaml-tiny-perl libfile-homedir-perl
          version: 1.0
          execute_install_scripts: true
      - name: Install latexindent
        uses: zauguin/install-texlive@c9f3ea3d51b2e04d092c4f9d208a19542d5dabcf # v4.5.0
        with:
          packages: latexindent
          texlive_version: <%= texlive %>
      - run: make format LOCAL=1
      - name: No changes made by latexindent
        run: git diff --exit-code
